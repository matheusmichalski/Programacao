<meta charset="UTF-8">
<script src="../../../utils.js"></script>
<script>
    /*
    PROBLEMA: CUMPRIMENTAR DE ACORDO COM O TURNO
    Faça um script que pergunte em que turno você estuda.
    Peça para digitar M-matutino ou V-Vespertino ou N- Noturno.
    Imprima a mensagem
    - "Bom Dia!"
    - "Boa Tarde!" ou
    - "Boa Noite!" ou
    - "Valor Inválido!"
    conforme o caso.
    */

    //ENTRADA
    debugger
    let matriz = [ 
        createProp('string',
        `request: Informe o turno em que você estuda \n
        Seja M-matutino ou V-Vespertino ou N- Noturno.`.toUpperCase()),
        {
            shiftsStudy: '' 
        }
    ]

    // switch (matriz.shiftsStudy){
        // case === 'M':
    // }

    switch (matriz[0].request) {
        case 'M':
            matriz[1] = {shiftsStudy: 'Matutino'}         
            break;
        case 'V':
            matriz[1] = {shiftsStudy: 'Vespertino'}
            break;
        default:
            matriz[1] = {shiftsStudy: 'Noturno'}
            break;
    }
    
    display(`O turno em que você ${matriz[1].shiftsStudy}`)
    
    //PROCESSAMENTO

    
    //SAÍDA

</script>
