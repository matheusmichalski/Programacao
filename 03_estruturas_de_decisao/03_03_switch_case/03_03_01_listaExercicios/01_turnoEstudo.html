<meta charset="UTF-8">
<script src="../../../utils.js"></script>
<script>
    /*
    PROBLEMA: CUMPRIMENTAR DE ACORDO COM O TURNO
    Faça um script que pergunte em que turno você estuda.
    Peça para digitar M-matutino ou V-Vespertino ou N- Noturno.
    Imprima a mensagem
    - "Bom Dia!"
    - "Boa Tarde!" ou
    - "Boa Noite!" ou
    - "Valor Inválido!"
    conforme o caso.
    */

    //ENTRADA

    const shiftsStudy = reqString(`request: Informe o turno em que você estuda \n   
    Seja M-matutino ou V-Vespertino ou N- Noturno.`).toUpperCase()

    let response = 'Você estuda no turno:'

    //PROCESSAMENTO
    switch (shiftsStudy) {
        case 'M':
            response += 'Matutino'
            break;
        case 'V':
            response += 'Verpertino'
            break;
        case 'N':
            response += 'Noturno'
        default:
            response = 'Valor inválido'
            break;
    }

    //SAÍDA
    display(response)

</script>
