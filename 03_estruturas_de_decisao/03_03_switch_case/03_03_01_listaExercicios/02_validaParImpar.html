<script>
  /*
  PROBLEMA: VERIFICAR NÚMERO PAR OU ÍMPAR
  Faça um script que peça um número inteiro e determine se ele é par ou ímpar.
  */
  let int;
  //ENTRADA
  do {
    if (int != undefined) alert('Informe um Inteiro válido.')
    int = reqNumber('Informe um inteiro');
  } while ((int % 1) > 0);

  let response = 'Seu número é: '
  //PROCESSAMENTO

  switch (int) {
    case (int % 2) === 0:
      response += 'Par'
      break;
    default:
      response += 'Ímpar'
      break;
  }

  //SAÍDA
  display(response)

</script>
