<meta charset="UTF-8">
<script src="../../../utils.js"></script>
<script>
  /*
  PROBLEMA: CÁLCULO ENTRE DOIS NÚMEROS
  Faça um script que leia 2 números e em seguida pergunte ao usuário qual operação ele deseja realizar. O resultado da operação deve ser acompanhado de uma frase que diga se o número é:
  - par ou ímpar;
  - positivo ou negativo;
  - inteiro ou decimal.
  */

  //ENTRADA

  const int1 = reqNumber('Informe um número(1)');
  const int2 = reqNumber('Informe um número(2)');
  const performedOperation = reqString(`Qual operação você deseja realizar?\n
    seja: subtração: -, soma: +, divisão: /, multiplicação: *, potenciação: ** ,radiciação: /**`);

  //PROCESSAMENTO

  let responseOperation;
  const operations = ['subtração', 'divisão', 'multiplicação', 'soma', 'radiciação', 'potenciação', '+', '-', '*', '**', '/**']

  if (operations.includes(performedOperation)) {
    switch (performedOperation) {
      case '+':
        responseOperation = int1 + int2
        break;
      case '-':
        responseOperation = int1 - int2
        break;
      case '*':
        responseOperation = int1 * int2
        break;
      case '/':
        responseOperation = int1 / int2
        break;
      case '**':
        responseOperation = int1 ** int2
        break;
      case '/**':
        responseOperation = int1 ** (1 / int2)
        break;
    }
  }

  //SAÍDA
  display(`O resultado com a operação ${performedOperation}: ${responseOperation};<br>
    O seu numero é ${(responseOperation % 2 == 0) ? 'par' : 'impar'};<br>
    ${(responseOperation / -1) > 0 ? 'Positivo' : 'Negativo'}<br>
    ${(responseOperation % 1) == 0 ? 'Inteiro' : 'Decimal'}
   `
  )

</script>
