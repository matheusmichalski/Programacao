<meta charset="UTF-8">
<script src="../../../utils.js"></script>
<script>
  /*
  PROBLEMA: ESTAÇÃO DO ANO
  Faça um script que pergunte para a pessoa em qual hemisfério ela está e qual o mês atual.
  De acordo com as respostas, informe qual a estação do ano correspondente.
  */

  //ENTRADA
  const currentMonth = reqString('Qual o mês atual?').toLowerCase();
  const localHemisphere = reqString('Qual hemisfério você está (norte ou sul)?').toLowerCase();

  //PROCESSAMENTO
  let season;

  switch (localHemisphere) {
    case 'norte':
      switch (currentMonth) {
        case 'dezembro':
        case 'janeiro':
        case 'fevereiro':
          season = 'Inverno';
          break;
        case 'março':
        case 'abril':
        case 'maio':
          season = 'Primavera';
          break;
        case 'junho':
        case 'julho':
        case 'agosto':
          season = 'Verão';
          break;
        case 'setembro':
        case 'outubro':
        case 'novembro':
          season = 'Outono';
          break;
        default:
          season = 'Mês inválido';
      }
      break;

    case 'sul':
      switch (currentMonth) {
        case 'dezembro':
        case 'janeiro':
        case 'fevereiro':
          season = 'Verão';
          break;
        case 'março':
        case 'abril':
        case 'maio':
          season = 'Outono';
          break;
        case 'junho':
        case 'julho':
        case 'agosto':
          season = 'Inverno';
          break;
        case 'setembro':
        case 'outubro':
        case 'novembro':
          season = 'Primavera';
          break;
        default:
          season = 'Mês inválido';
      }
      break;

    default:
      season = 'Estação do ano não encontrada';
      break;
  }

  //SAÍDA
  display(`A estação do ano no hemisfério ${localHemisphere} em ${currentMonth} é: ${season}`);
</script>
