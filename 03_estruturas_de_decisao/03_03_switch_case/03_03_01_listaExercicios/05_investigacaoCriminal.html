<meta charset="UTF-8">
<script src="../../../utils.js"></script>
<script>
  /*
  PROBLEMA: INVESTIGAÇÃO CRIMINAL
  Faça um script que faça 5 perguntas para uma pessoa sobre um crime. As perguntas são:
  - "Telefonou para a vítima?"
  - "Esteve no local do crime?"
  - "Mora perto da vítima?"
  - "Devia para a vítima?"
  - "Já trabalhou com a vítima?"
  O script deve no final emitir uma classificação sobre a participação da pessoa no crime. Se a pessoa responder positivamente a 2 questões ela deve ser classificada como "Suspeita", entre 3 e 4 como "Cúmplice" e 5 como "Assassino". Caso contrário, ele será classificado como "Inocente".
  */

  //ENTRADA

  const questions = [
    "Você telefonou para a vítima? (Responda com S-SIM ou N-NÃO)",
    "Você esteve no local do crime? (Responda com S-SIM ou N-NÃO)",
    "Você mora perto da vítima? (Responda com S-SIM ou N-NÃO)",
    "Você devia algo para a vítima? (Responda com S-SIM ou N-NÃO)",
    "Você já trabalhou junto com a vítima? (Responda com S-SIM ou N-NÃO)"
  ];
  const resQuestions = [];
  //PROCESSAMENTO

  for (question of questions) {
    let createPrompt;
    do {
      if (createPrompt != undefined) alert('Informe um valor válido');
      createPrompt = reqString(question).toUpperCase();
    } while (createPrompt != 'S' && createPrompt != 'N');

    switch (createPrompt) {
      case 'S':
        resQuestions.push(createPrompt)
        break;
    }
  }

  let response = `O acusado é: `
  switch (resQuestions.length) {
    case 2:
      response += 'Suspeito';
      break;
    case 3:
    case 4:
      response += 'Cúmplice';
      break;
    case 5:
      response += 'Assassino';
      break;
    default:
      response += 'Inocente';
      break;
  }

  //SAÍDA
  display(response)

</script>
