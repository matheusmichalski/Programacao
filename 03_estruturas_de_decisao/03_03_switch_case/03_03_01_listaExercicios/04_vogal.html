<script>
  /*
  PROBLEMA: VOGAL
  Construa um programa que leia um caractere e informe se este caractere é uma vogal.
  */

  // ENTRADA

  const character = reqString('Informe um caractere.').toLowerCase();
  let response = 'O seu caractere ';

  // PROCESSAMENTO

  switch (character) {
    case 'a':
    case 'e':
    case 'i':
    case 'o':
    case 'u':
      response += 'é uma vogal.';
      break;
    default:
      response += 'não é uma vogal.';
      break;
  }

  // SAÍDA
  display(response);

</script>
