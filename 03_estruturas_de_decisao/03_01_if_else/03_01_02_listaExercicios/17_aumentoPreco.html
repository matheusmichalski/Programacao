<meta charset="UTF-8" />
<script src="../../../utils.js"></script>
<script>
    /*
    PROBLEMA: AUMENTO DE PREÇO
    Recebe o preço do produto e calcula o aumento do preço, baseado no seguinte critério:
    - até 280(inclusive): aumento de 20 %
    - até 700(inclusive): aumento de 15 %
    - até 1500(inclusive): aumento de 10 %
    - acima de 1500: aumento de 5 %
    */

    //ENTRADA
    const reqPrice = reqNumber('Informe o preço de um produto')


    //PROCESSAMENTO
    let resPrice = reqPrice

    if (reqPrice >= 280) {
        resPrice *= 1.2
    } else if (reqPrice <= 700) {
        resPrice *= 1.15
    } else if (reqPrice <= 1500) {
        resPrice *= 1.1
    } else {
        resPrice *= 1.05
    }


    //SAÍDA
    display(`O valor do produto com o aumento de R$${reqPrice} com o aumento de ${((resPrice / reqPrice) * 100) - 100}% é R$${resPrice}`)
</script>
