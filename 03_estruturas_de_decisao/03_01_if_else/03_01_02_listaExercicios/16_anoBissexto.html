<meta charset="UTF-8" />
<script src="../../../utils.js"></script>
<script>
    /*
    PROBLEMA: ANO BISSEXTO
    Recebe um ano e informa se ele é bissexto ou não.
    */

    //ENTRADA

    const currentYear = reqNumber('Informe um ano.')

    //PROCESSAMENTO
    if (currentYear % 4 === 0) display(`O ano ${currentYear} é bissexto`);
    else display(`O ano ${currentYear} não é bissexto`);


    //SAÍDA

</script>
