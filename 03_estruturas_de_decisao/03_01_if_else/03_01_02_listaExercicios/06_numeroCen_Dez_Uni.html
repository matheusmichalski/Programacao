<script src="../../../utils.js"></script>
<script>
    /*
    PROBLEMA: NÚMERO DE CENTENAS, DEZENAS E UNIDADES
    Faça um script que leia um número inteiro menor que 1000 e imprima a quantidade de centenas, dezenas e unidades do mesmo.
    Observando os termos no plural a colocação do "e", da vírgula entre outros.
    
    Exemplo:
    326 = 3 centenas, 2 dezenas e 6 unidades
    12 = 1 dezena e 2 unidades
    Testar com: 326, 300, 100, 320, 310,305, 301, 101, 311, 111, 25, 20, 10, 21, 11, 1, 7 e 16
    */

    //ENTRADA
    let matriz = [
        createVar('number',
            'num: Informe um número natural menos que 1000',
        ),
        {
            centenasValue: 0,
            dezenasValue: 0,
            unidadesValue: 0,
        },
        // [
        //     ('Centena' ? centenasValue > 1 : 'Centenas'),
        //     ('Dezena' ? dezenasValue > 1 : 'Dezenas'),
        //     ( 'Unidade' ? unidadesText > 1 : 'Unidades')
        // ]
    ]

    //PROCESSAMENTO
    matriz[1].centenasValue = Math.floor(matriz[0].num);
    matriz[1].dezenasValue = Math.floor((matriz[0].num - (centenasValue * 100)) / 10);
    matriz[1].unidadesValue = Math.floor(matriz[0].num - (centenasValue * 100 && dezenasValue * 50));

    //SAÍDA

        for (valor in matriz[1]) {
            let createDisplay = ``
            if (!isNaN(valor)) {
                createDisplay += `<li>${valor[2][valor]}<li>`
            }
        }
    display(`O número total apresentado: ${matriz[0].num}
    <ul>
        ${createDisplay}
    <ul>
    `)

</script>
