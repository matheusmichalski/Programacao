<script>
    /*
    //PROBLEMA: TROCAR VARIÁVEIS
    Faça um script que pede dois inteiros e armazene eles em duas variáveis.
    Em seguida, troque o valor das variáveis, invertendo e exibindo o antes e o depois em uma janela de alert.
    */

    //ENTRADA

    let int1 = reqNumber('Informe um número(1)');
    let int2 = reqNumber('Informe um número(2)');

    let displayNumbers = `Os valores recebidos são ${`${int1} e ${int2}`}.<br>`;

    //PROCESSAMENTO

    [int1, int2] = [int2, int1] // Invertendo valores a partir de desestruturação.

    //SAÍDA
    displayNumbers += `Os valores invertidos são ${`${int1} e ${int2}`}.`;
    display(displayNumbers);

</script>
