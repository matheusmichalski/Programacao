<script>
    /*
    PROBLEMA: VALIDA PAR OU ÍMPAR
    Faça um script que peça um número inteiro e determine se ele é par ou ímpar.
    */

    //ENTRADA
    const matriz = createVar('prop','number',
        'int: informe o um valor inteiro!'
    )

    //PROCESSAMENTO

    display(`O inteiro ${matriz.int} é ${matriz.int % 2 === 0 ? 'par' : 'impar'}`)



    //SAÍDA

</script>
