<script src="../../../utils.js"></script>
<script>
	/*
	PROBLEMA: CAIXA ELETRÔNICO
	Faça um script para um caixa eletrônico. O script deverá perguntar ao usuário a valor do saque e depois informar quantas notas de cada valor serão fornecidas. As notas disponíveis serão as de 1, 5, 10, 50 e 100 reais. O valor mínimo é de 10 reais e o máximo de 600 reais. O script não deve se preocupar com a quantidade de notas existentes na máquina.

	Exemplo: Para sacar a quantia de 256 reais, o script fornece duas notas de 100, uma nota de 50, uma nota de 5 e uma nota de 1;
	Exemplo: Para sacar a quantia de 399 reais, o script fornece três notas de 100, uma nota de 50, quatro notas de 10, uma nota de 5 e quatro notas de 1.
	*/
	//ENTRADA

	let totalValue, notes100Value, notes50Value, notes10Value, notes5Value, notes1Value;
	do {
		if (totalValue != undefined) { alert('Informe um valor válido') };
		totalValue = reqNumber('Informe o valor que deseja sacar(mínimo 10, máximo 600.)')

	} while (isNaN(totalValue) || totalValue < 10 || totalValue > 600);

	let response = `Para ${totalValue}, serão necessárias<br>`

	if (totalValue > 100) {
		notes100Value = Math.floor(totalValue / 100)
		response += `${notes100Value} notas de 100`;
	} else if ((totalValue - notes100Value * 100) > 50) {
		notes50Value = ((totalValue - notes100Value * 100) / 50)
		response += `${notes50Value} notas de 50`;
	} else if (totalValue - (notes100Value * 100 + notes50Value * 50) > 10) {
		notes10Value = (totalValue - ((notes100Value * 100) + (notes50Value * 50)) / 10);
		response += `${Math.floor(notes10Value)} notas de 10`;
	} else if (totalValue > 5) {
		notes5Value = (totalValue - ((notes100Value * 100) + (notes50Value * 50) + (notes10Value * 10)) / 5);
		response += `${Math.floor(notes5Value)} notas de 5`;
	} else if (totalValue > 1) {
		notes1Value = (totalValue - ((notes100Value * 100) + (notes50Value * 50) + (notes10Value * 10) + (notes5Value * 5)));
		response += `${Math.floor(notes1Value)} notas de 1`;
	}

	//PROCESSAMENTO
	display(response)


	//SAÍDA
</script>
