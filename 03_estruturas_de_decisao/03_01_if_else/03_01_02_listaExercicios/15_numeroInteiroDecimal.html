<script>
    /*
    PROBLEMA: NÚMERO INTEIRO OU DECIMAL
    Faça um script que peça um número e informe se o número é inteiro ou decimal.
    Dica: utilize uma função de arredondamento.
    */

    //ENTRADA
    const numbers = createVar('number', 
        'num1: Informe um número.',
    )

    //PROCESSAMENTO
    if (numbers.num1 % 1 === 0) alert('Seu número é Inteiro');
    else alert('Seu número é decimal');
    
    //SAÍDA

</script>
