<meta charset="UTF-8" />
<script src="../../../utils.js"></script>
<script>
    /*
    PROBLEMA: NOTA PARA CONCEITO
    Converta a nota para conceito, conforme a tabela abaixo:
    Nota                     Conceito
    Entre 10.0 e 9.0            A
    Entre 8.9 e 8.0             B
    Entre 7.9 e 7.0             C
    Entre 6.9 e 6.0             D
    Entre 5.9 e zero            E
    */

    //ENTRADA
    const schoolGrade = reqNumber('Informe a nota do aluno');

    //PROCESSAMENTO
    let gradeConcept;

    if (schoolGrade >= 9.0 && schoolGrade <= 10.0) {
        gradeConcept = 'A';
    } else if (schoolGrade >= 8.0 && schoolGrade < 9.0) {
        gradeConcept = 'B';
    } else if (schoolGrade >= 7.0 && schoolGrade < 8.0) {
        gradeConcept = 'C';
    } else if (schoolGrade >= 6.0 && schoolGrade < 7.0) {
        gradeConcept = 'D';
    } else if (schoolGrade >= 0 && schoolGrade < 6.0) {
        gradeConcept = 'E';
    } else {
        alert('Nota inválida. Informe uma nota entre 0 e 10.');
    }

    //SAÍDA
    if (gradeConcept) {
        display(`O conceito do aluno é: ${gradeConcept}`);
    }
</script>
