<script>
  /*
  PROBLEMA: ORDEM DECRESCENTE
  Faça um script que leia três números e mostre-os em ordem decrescente.
  */

  //ENTRADA

  const num1 = reqNumber('Informe um número(1)')
  const num2 = reqNumber('Informe um número(2)')
  const num3 = reqNumber('Informe um número(3)')
  const orderedNumbers = []

  //PROCESSAMENTO

  if (num1 <= num2 && num1 <= num3) {
    orderedNumbers.push(num1);
    if (num2 <= num3) {
      orderedNumbers.push(num2, num3);
    } else {
      orderedNumbers.push(num3, num2);
    }
  } else if (num2 <= num1 && num2 <= num3) {
    orderedNumbers.push(num2);
    if (num1 <= num3) {
      orderedNumbers.push(num1, num3);
    } else {
      orderedNumbers.push(num3, num1);
    }
  } else {
    orderedNumbers.push(num3);
    if (num1 <= num2) {
      orderedNumbers.push(num1, num2);
    } else {
      orderedNumbers.push(num2, num1);
    }
  }

  //SAÍDA
  display(`Os números ordenados são: ${orderedNumbers.join(', ')}.`)
</script>
