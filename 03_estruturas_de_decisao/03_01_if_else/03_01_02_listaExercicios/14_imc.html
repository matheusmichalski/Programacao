<script>
  /*
  PROBLEMA: IMC
  Escreva uma função que calcula o índice de massa corporal(imc = peso / altura ** 2), de /// acordo com a seguinte tabela:
  imc <= 18.5: "Subpeso"
  imc <= 25.0: "Normal"]
  imc <= 30.0: "Sobrepeso"
  imc > 30: "Obeso"
  */

  //ENTRADA
  const BodyWeightTable = {
    weight: reqNumber('Informe o seu peso(Em kg).'),
    heigth: reqNumber('Informe a sua altura(Em m).')
  }

  const imc = BodyWeightTable.weight / (BodyWeightTable.heigth ** 2)

  //PROCESSAMENTO
  if (Imc <= 18.5) display('Você está em sub-peso')
  else if (Imc <= 25.0) display('Você está em peso Normal')
  else if (Imc <= 30.0) display('Você está em sub-peso')
  else display('Você está Obeso')

  //SAÍDA

</script>
