<script src="../../../utils.js"></script>
<script>
    /*
    //PROBLEMA: TURNO DE ESTUDO
    Faça um script que pergunte em que turno você estuda.
    Peça para digitar M-matutino ou V-Vespertino ou N-Noturno.
    Imprima a mensagem
    - "Bom Dia!"
    - "Boa Tarde!" ou
    - "Boa Noite!" ou
    - "Valor Inválido!"
    conforme o caso.
    */

    //ENTRADA

    const studiedTurn = reqString('Qual turno você estuda?').toUpperCase()

    //PROCESSAMENTO

    if (studiedTurn === 'M') 'Bom dia!'; else if (studiedTurn === 'V') 'Boa Tarde!'; else if (studiedTurn === 'N') 'Boa Noite'; else 'Valor Inválido';

    if (['M', 'V', 'N'].includes(studiedTurn)) {
        display(` Você estuda no turno: ${studiedTurn === 'M' ? 'Matutino' : studiedTurn === 'V' ? 'Vespertino' : 'Noturno'}`);
    } else {
        display('Valor Inválido')
    }


    //SAÍDA

</script>
