<meta charset="UTF-8" />
<script src="../../../utils.js"></script>
<script>
    /*
    PROBLEMA: PROCURAR LETRA
    Peça para o usuário digitar UMA palavra.
    Peça para o usuário digitar a letra que deseja encontrar na palavra que acabou de digitar.

    Apresente para o usuário se a LETRA que ele quer procurar existe ou não na palavra digitada e qual a primeira posição da LETRA na PALAVRA.
    */

    //ENTRADA
    const word = prompt('Digite uma palavra:').trim().toLowerCase().split(' ')[0];
    const letter = prompt('Digite uma letra:').toLowerCase().split('')[0];
    const allIndexLetter = [];

    let index = word.indexOf(letter); // Pega a primeira ocorrência
    while (index !== -1) {
        allIndexLetter.push(index + 1); // Salva o índice (posição iniciando em 1)
        index = word.indexOf(letter, index + 1); // Continua a busca a partir do próximo caractere
    }
    //PROCESSAMENTO
    let response = '';
    if (word.includes(letter)) {
        response = (`A letra "${letter}" existe na palavra "${word}" e está na posição ${allIndexLetter.length < 1 ? allIndexLetter : allIndexLetter.join(', ')}.`)
    } else {
        response = (`A letra ${letter.toUpperCase()} não existe na palavra ${word.toUpperCase()}.`)
    }

    //SAÍDA
    display(response);




</script>
