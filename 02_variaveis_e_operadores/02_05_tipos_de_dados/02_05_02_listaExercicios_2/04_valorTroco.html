<script src="../../../utils.js"></script>
<script>
    /*
    Problema: Aumento Salarial
    Peça para o usuário informar o salário atual e a porcentagem de aumento. Faça o cálculo do salário final após o aumento baseado na porcentagem informada e apresente o resultado.
    */

    //ENTRADA
    const salarioAtual = toAsk('Informe seu salário atual.')
    const porcentAumento = toAsk('Informe a porcentagem de aumento')
    
    //PROCESSAMENTO
    const salarioFinal = salarioAtual * ((porcentAumento / 100) + 1)

    //SAÍDA
    mostrar(`Salario final ${salarioFinal}.`)

</script>
