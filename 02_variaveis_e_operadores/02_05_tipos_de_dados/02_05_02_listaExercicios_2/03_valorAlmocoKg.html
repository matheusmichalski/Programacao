<script>
    /*
    Problema: Metros para milímetros
    Peça para o usuário informar um valor em metros. O programa deverá retornar uma mensagem convertendo o valor para milímetros, sabendo que 1 metro equivale a 1000 milímetros.
    */

    //ENTRADA
    const valorEmMetros = toAsk('Informe um valor em metros')

    //PROCESSAMENTO
    const valorEmMilimetros = multiplicar(valorEmMetros, 1000)

    //SAÍDA
    mostrar(`A coversão de ${valorEmMetros} metros, em milimetros, é ${valorEmMilimetros}.`)

</script>
