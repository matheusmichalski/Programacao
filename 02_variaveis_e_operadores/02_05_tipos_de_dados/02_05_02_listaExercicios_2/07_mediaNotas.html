<script>
    /*
    Problema: Gorjeta
    Peça para o usuário informar qual foi o preço do jantar. Calcule 10% da gorjeta e apresente o preço total que deverá pagar para o restaurante e apresente o resultado.
    */

    //ENTRADA
    const precoJantar = perguntar('Qual foi o preço do jantar?')
    
    //PROCESSAMENTO
    const valorGorjeta = precoJantar * 0.1

    //SAÍDA
    mostrar(`Valor da gorjeta ${valorGorjeta}.`)

</script>
