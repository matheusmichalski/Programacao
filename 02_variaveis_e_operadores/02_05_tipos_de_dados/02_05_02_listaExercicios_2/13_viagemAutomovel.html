<meta charset="UTF-8">
<script src="utils.js"></script>
<script>
    //PROBLEMA
    //Salário líquido
    //Peça para o usuário informar quantas horas trabalha no mês e quantos que recebe por hora trabalhada.Calcule o salário líquido considerando os seguintes descontos:
    // INSS: 8 % do salário bruto
    // IR: 11 % do salário bruto

    //ENTRADA
    const horasTrabalhadas = toAsk('Quantas horas você trabalha por mês?')
    const salarioPorHora = toAsk('Quanto você recebe por hora de trabalho?')
    
    //PROCESSAMENTO
    const salarioBruto = horasTrabalhadas * salarioPorHora
    const salarioLiquido = salarioBruto * 0.81

    //SAÍDA
    mostrar(`O seu salário líquido é R$${salarioLiquido}.`)

</script>
