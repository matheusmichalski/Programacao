<script>
    /*
    Problema: Diferença de idade
    Peça para o usuário informar o seu ano de nascimento e o ano de nascimento do irmão mais velho. Após, o programa deverá apresentar uma mensagem especificando a diferença de idade entre os irmãos.
    */

    //ENTRADA

    const idadeMaior = perguntar("Qual a idade do seu irmão mais velho?")
    const idadeMenor = perguntar("Qual a idade do seu irmão mais novo?")


    //PROCESSAMENTO

    const diferenca = subtrair (idadeMaior,idadeMenor)


    //SAÍDA
    mostrar(`A diferença de idade entre os irmãos é ${diferenca}.`)

</script>
