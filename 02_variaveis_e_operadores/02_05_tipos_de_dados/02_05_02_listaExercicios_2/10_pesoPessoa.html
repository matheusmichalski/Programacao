<script>
    /*
    PROBLEMA: Problema 10: Dias para segundos
    Peça para o usuário informar uma data em dias com horas, minutos e segundos e retorne a data em segundos, considerando quantos segundos já se passaram desde o início do ano informado pelo usuário.
    */

    //ENTRADA
    const dias = toAsk('Qual os dias?')
    const horas = toAsk('Qual a hora?')
    const minutos = toAsk('Qual a minuto?')
    const segundos = toAsk('Qual a segundo?')

    //PROCESSAMENTO
    const segundosTotais = segundos + (minutos * 60) + (horas * 3600) + (dias * 86400)

    //SAÍDA
    mostrar(`Segundos decorridos ${segundosTotais}.`)

</script>
