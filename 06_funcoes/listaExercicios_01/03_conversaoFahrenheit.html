<script>
    /*
    PROBLEMA: CONVERSÃO PARA FAHRENHEIT
    Desenvolva um programa em JavaScript que contenha uma função para a conversão de uma temperatura em graus Celsius para Fahrenheit. A fórmula de conversão é a seguinte:
    F = (9 * C + 160) / 5
    */

    //ENTRADA
    const celsius = Number(prompt("Informe uma temperatura em celcius"))


    //PROCESSAMENTO
    const getFahrenheit = (celsius) => {
        const fahrenheitTemp = (9 * celsius + 160) / 5
        alert(`A temperatura ${celsius} celsius em Fahrenheit é ${fahrenheitTemp}`)
    }


    //SAÍDA
    getFahrenheit(celsius)


</script>
