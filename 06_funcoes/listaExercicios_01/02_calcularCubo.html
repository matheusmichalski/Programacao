<script>
    /*
    PROBLEMA: CALCULAR CUBO DE UM NÚMERO
    Peça para o usuário informar um número inteiro.
    Desenvolva um programa que contenha uma função que calcule o cubo desse número. Apresente o resultado para o usuário.
    */

    //ENTRADA
    const number = Number(prompt("Informe um número"))

    //PROCESSAMENTO
    const getCubeNumber = (number) => {
        const cubeNumber = Math.pow(number, 3)
        alert(`O número ${number} ao cubo é ${cubeNumber}`)
    }


    //SAÍDA
    getCubeNumber(number)
</script>
