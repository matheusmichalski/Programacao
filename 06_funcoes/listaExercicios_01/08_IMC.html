<script src="../../../utils.js"></script>
<script>
    /*
    PROBLEMA: CÁLCULO DO IMC
    Desenvolva um programa que contenha uma função que calcule o IMC de uma pessoa. A fórmula para o cálculo do IMC é a seguinte:
    IMC = peso / altura²
    */

    //ENTRADA
    const weigth = Number(prompt("Informe o seu peso(kg)"))
    const heigth = Number(prompt("Informe o sua altura(m)"))


    //PROCESSAMENTO
    const getIMC = (weigth, heigth) => {
        const IMC = weigth / heigth ** 2
        alert(`Seu imc é com ${weigth} kg's e ${heigth} metros de altura é: ${IMC.toFixed(2)}`)
    }


    //SAÍDA
    getIMC(weigth, heigth)

</script>
