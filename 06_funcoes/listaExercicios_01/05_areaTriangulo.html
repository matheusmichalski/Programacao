<script>
    /*
    PROBLEMA: ÁREA DO TRIÂNGULO
    Desenvolva um programa que contenha uma função que calcule a área de um triângulo. A fórmula para o cálculo da área de um triângulo é a seguinte:
    A = (b * h) / 2
    */

    //ENTRADA
    const base = Number(prompt("Informe a base do triângulo"))
    const heigth = Number(prompt("Informe a altura do triângulo"))


    //PROCESSAMENTO
    const getTriangleArea = (base, heigth) => {
        const triangleArea = (base * heigth) / 2
        alert(`A área de um triângulo de base ${base} e altura ${heigth} é: ${triangleArea}`)
    }


    //SAÍDA
    getTriangleArea(base, heigth)

</script>
