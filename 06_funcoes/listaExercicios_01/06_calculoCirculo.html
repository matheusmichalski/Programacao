<script src="../../../utils.js"></script>
<script>
    /*
    PROBLEMA: CALCULAR ÁREA E PERÍMETRO DE UM CÍRCULO
    Desenvovla um programa que contenha uma função que calcule a área e o perímetro de um círculo. A fórmula para o cálculo da área de um círculo é a seguinte:
    A = π * r²
    Onde π é uma constante e r é o raio do círculo. A fórmula para o cálculo do perímetro de um círculo é a seguinte:
    P = 2 * π * r
    */

    //ENTRADA
    const radius = Number(prompt("Informe o raio do círculo"))

    //PROCESSAMENTO
    const getCircleProps = (radius) => {
        const circleArea = (Math.PI * radius ** 2)
        const perimeterCircle = 2 * Math.PI * radius
        alert(`A área de um círculo de raio ${radius} é ${circleArea.toFixed(2)}.\n O seu perímetro é ${perimeterCircle.toFixed(2)}`)
    }


    //SAÍDA
    getCircleProps(radius)


</script>
