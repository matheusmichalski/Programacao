<script src="../../../utils.js"></script>
<script>
    /*
    PROBLEMA: CALCULAR FATORIAL
    Peça para o usuário informar um número inteiro. Calcule o fatorial do número informado pelo usuário, usando função JavaScript e retorne o resultado para o usuário.
    */

    //ENTRADA
    const number = Number(prompt("Informe um número inteiro"))

    //PROCESSAMENTO
    const getFactorialNumber = (number) => {
        if (number == 1) {
            return 1;
        } else {
            return number * getFactorialNumber(number - 1);
        }
    }

    //SAÍDA
    alert(`Fatorial de ${number} é: ${getFactorialNumber(number)}`)

</script>
