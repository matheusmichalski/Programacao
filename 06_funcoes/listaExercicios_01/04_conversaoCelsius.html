<script src="../../../utils.js"></script>
<script>
    /*
    PROBLEMA: CONVERSÃO PARA CELSIUS
    Desenvolva um programa em JavaScript que contenha uma função para a conversão de uma temperatura em graus Fahrenheit para Celsius. A fórmula de conversão é a seguinte:
    C = (F - 32) * 5 / 9
    */

    //ENTRADA
    const fahrenheit = Number(prompt("Informe uma temperatura em celcius"))


    //PROCESSAMENTO
    const getFahrenheit = (fahrenheit) => {
        const celsiusTemp = (fahrenheit - 32) * 5 / 9
        alert(`A temperatura ${fahrenheit} fahrenheit em celsius é ${celsiusTemp}`)
    }


    //SAÍDA
    getFahrenheit(fahrenheit)


</script>
