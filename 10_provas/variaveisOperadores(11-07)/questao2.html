<script>

/* 
2: Você foi encarregado de realizar uma pesquisa sobre acesso a computadores. A sua pesquisa deverá apresentar o percentual de alunos da sua escola que possuem acesso computadores. Para isso, elabore um algoritmo que leia o número total de alunos da sua escola e o número de alunos que possuem acesso a computadores. Por fim, com base nestes dados, escreva o percentual de alunos com acesso a computadores. 
*/

//Entrada

const numStudents = toAsk('Informe o total de alunos na sua escola.');
const numStudentsWithComputer = toAsk('Informe o total de alunos na sua escola que possuem acesso ao computador.'); 

//Processamento

const percentageStudantesWithComputer = (numStudentsWithComputer / numStudents) * 100;


//Saída

display(`O total de estudantes com acesso a computador é: ${percentageStudantesWithComputer.toFixed(2)}%.`)








</script>
