<script>
/*
4: Considere que o preço final de um carro novo é a soma do custo de fábrica, a porcentagem do distribuidor (28%) e dos impostos (45%), ambos aplicados sobre o custo de fábrica.
*/

//Entrada

const factoryValue = toAsk('Qual o valor de fábrica do carro?')

//Processamento

const carWithadditionalValues = factoryValue + (factoryValue * 0.28 + factoryValue * 0.45);

//Saída

display(`O valor final do carro é: R$${carWithadditionalValues.toFixed(2).replace('.',',')}`);

</script>
