<script>
/*
1: Elaborar um programa para um moto taxy. O programa deve ler o valor a ser pago para cada 5 km de distância e a distância total para realizar a entrega, em km. Informe o valor a ser pago pelo cliente, sabendo que as frações extras de 5 kms devem ser cobradas de forma integral.
*/

//Entrada 

const valorEm5Km = toAsk('Informe o valor a ser pago a cada 5km.');
const distanciaEntrega = toAsk('Informe a distância total da entrega(em Km).');

//Processamento

const valorPagar = multiplicar(valorEm5Km, Math.ceil(distanciaEntrega));


//Saída

display(`O valor a ser pago será de: R$${valorPagar}.`);


</script>
