<script src="/utils.js"></script>
<script>
/*
/*
Desafio: Considere o sconst newRound = (value, decimals) => Math.ceil(value * 10 ** decimals) / 10 ** decimals

// const test = 1.42333123213

// console.log(newRound(test, 2))
// console.log(newRound(test, 4))eguinte cenário:
Uma loja de carros usados paga aos vendedores um salário fixo por mês, além de comissão para cada carro vendido, no valor de R$ 300,00. Também, sobre o valor total vendido, o funcionário receberá outros 5% de comissão.
Faça um script que receba o salário fixo pago por mês, a quantidade de carros vendidos, e também o valor total dos carros vendidos pelo funcionário.
Calcule e escreva o salário final do vendedor, aplicando desconto de 27%, referente ao imposto de renda.
*/

//Entrada

const salarioFixo = toAsk('Informe o salário fixo do funcionário.');
const carrosVendidos = toAsk('Informe a quantidade de carros vendidos.');
const valorTotalDosCarrosVendidos = toAsk('Informe o valor total dos carros vendidos pelo funcionário.');

//Processamento

const salarioTotal = (salarioFixo + Math.ceil((carrosVendidos * 300)) + (valorTotalDosCarrosVendidos * 0.05))
const imposto = salarioTotal * 0.27;
const salarioFinal = salarioTotal - imposto     

//Saída
display(`
<ol>
    <li>Salário fixo: R$${salarioFixo.toFixed(2).replace('.',',')};</li>
    <li>Quantidade de carros vendidos: ${carrosVendidos.toFixed(2).replace('.',',')};</li>
    <li>Valor dos carros vendidos: ${valorTotalDosCarrosVendidos.toFixed(2).replace('.',',')};</li>
    <li>Imposto de renda sobre o salario(27%): ${imposto.toFixed(2).replace('.',',')};</li>
</ol>
<h1 id = salarioFinal>Salário final: R$${salarioFinal.toFixed(2).replace('.',',')}</h1>

<style>
    #salarioFinal {
        display: flex;
        justify-content: center;
    }
`)




    
</script>
