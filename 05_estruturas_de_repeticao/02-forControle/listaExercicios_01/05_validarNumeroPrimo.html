<meta charset="UTF-8">
<script src="../../../utils.js"></script>
<script>
    /*
    PROBLEMA: VALIDAR NÚMERO PRIMO
    Faça um programa que peça para o usuário informar um número. Identifique se o número fornecido pelo usuário é um número primo e apresente na tela.
    */

    //ENTRADA
    const number = Number(prompt('Informe um número'))
    let isPrime = true;

    //PROCESSAMENTO
    for (let i = 2; i <= Math.sqrt(number); i++) {

        if (number % i === 0) {
            isPrime = false
        }
    }
    //SAÍDA

    display(`O número ${number} ${isPrime === true ? 'é' : 'não é'} primo.`)

</script>
