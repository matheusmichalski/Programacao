<meta charset="UTF-8" />
<script src="../../../utils.js"></script>
<script>
  /*
  PROBLEMA: IMPRIMIR NÚMEROS
  Faça um programa que pergunte ao usuário um número inicial e um número final. Verifique se o número inicial é menor que o número final e apresente na tela os números ímpares e os números pares que estão entre os dois números. Se o número inicial for maior ou igual ao número final, apresente mensagem de erro para o usuário, informando a regra para o número inicial e número final.
  */

  //ENTRADA
  const startNumber = Number(prompt("Informe o número inicial."));
  const finalNumber = Number(prompt("Informe o número final."));
  const evenNumbers = [];
  const oddNumbers = [];
  //PROCESSAMENTO
  if (startNumber < finalNumber) {
    for (let i = startNumber + 1; i < finalNumber; i++)
      if (i % 2 === 0) {
        evenNumbers.push(i);
      } else if (i % 2 !== 0) {
        oddNumbers.push(i);
      } else {
        console.error("Erro na execução");
      }
  } else {
    alert(`Número inicial maior que final ${startNumber} > ${finalNumber}.\n
        Informe um número inicial menor que o final.`);
  }

  //SAÍDA
  display(`Entre os números ${startNumber} e ${finalNumber} há:<br>
        <ul>
          <li>${evenNumbers.length} ${evenNumbers.length > 1 ? 'pares' : 'par'}:  ${evenNumbers.length > 1
      ? `${evenNumbers.slice(0, -1).join(', ')} e ${evenNumbers.slice(-1)}`
      : evenNumbers.join(", ")
    };
   <li>${oddNumbers.length} ${oddNumbers.length > 1 ? 'pares' : 'par'}: ${oddNumbers.length > 1
      ? `${oddNumbers.slice(0, -1).join(', ')} e ${oddNumbers.slice(-1)}`
      : oddNumbers.join(", ")
    };`);
</script>
