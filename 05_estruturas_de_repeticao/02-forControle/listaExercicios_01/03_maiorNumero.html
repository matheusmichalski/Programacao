<meta charset="UTF-8">
<script src="../../../utils.js"></script>
<script>
    /*
    PROBLEMA: MAIOR NÚMERO
    Faça um programa que peça ao usuário para informar cinco números.
    No final, apresente o maior número informado pelo usuário.
    */

    //ENTRADA 
    const numbers = []


    //PROCESSAMENTO
    for (let i = 0; i < 5; i++) {
        const newNumber = Number(prompt(`Informe um número(º${i + 1})`))
        numbers.push(newNumber)
    }


    //SAÍDA
    display(`O maior número informado foi ${numbers.sort((a, b) => b - a)[0]}.`)

</script>
