<script>
    /*
    PROBLEMA: INVESTIMENTOS
    Joãozinho investiu R$ 1.000,00 e o investimento renderá 2% por dia útil. Quantos dias demorará para que Joãozinho consiga o total de R$ 2.000,00.
    */

    //ENTRADA
    let days = 0

    //PROCESSAMENTO
    for (let invest = 1000; invest <= 2000; days++) {
        invest += invest * 0.02
    }


    //SAÍDA
    display(`Serão necessários ${days} para que Joãozinho chegue ao total de R$2.000,00`)

</script>
