<script src="../../../utils.js"></script>
<script>
    /*
    PROBLEMA: MÚLTIPLOS DE 3
    Criar um programa que imprima todos os números múltiplos de 3 entre 1 e 100. Calcule a soma dos números.
    */

    //ENTRADA

    const multiply3 = []

    //PROCESSAMENTO
    for (let i = 1; i <= 100; i++) {
        if (i % 3 === 0) {
            multiply3.push(i)
        }
    }

    const sumNumbers = multiply3.reduce((lastValue, atualValue) => {
        return lastValue + atualValue
    }, 0)

    //SAÍDA
    display(`Múltiplos entre 1 e 100: ${multiply3.join(',')}<br>
    Soma:${sumNumbers}`)

</script>
