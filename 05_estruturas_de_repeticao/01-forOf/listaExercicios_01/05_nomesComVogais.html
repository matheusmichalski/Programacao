<meta charset="UTF-8">
<script src="../../../utils.js"></script>
<script>
    //PROBLEMA
    //Considere a lista de nomes abaixo:
    // let listaDeNomes = ["Amanda", "Eduardo", "Fábio", "Evelin", "César", "José", "Ivo", "Eva", "Otávio", "Inez", "Osmar", "Ulisses"];
    //Identifique os nomes que começam com qualquer vogal (A, E, I, O, U) e apresente os nomes em ordem alfabética.

    //ENTRADA
    let listaDeNomes = ["Amanda", "Eduardo", "Fábio", "Evelin", "César", "José", "Ivo", "Eva", "Otávio", "Inez", "Osmar", "Ulisses"];
    let vowels = ['A', 'E', 'I', 'O', 'U'];
    let namesWithVowels = [];
    //PROCESSAMENTO

    for (let name of listaDeNomes) {
        if (vowels.includes(name.trim()[0])) {
            namesWithVowels.push(name);
        }
    }

    //SAÍDA
    display(`Todos os nomes: ${listaDeNomes.join(', ')}<br>
    Nomes que começam com vogais: ${namesWithVowels.sort().join(', ')}`);

</script>
